<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>小黑屋</title>
  <link rel="icon" href="favicon.ico">
  <script src="script/rogue/rogue.theme.js"></script>
  <script src="save-slots.js" defer></script>
  <script src="script/rogue/lang/zh.js" defer></script>
  <script src="home.js" defer></script>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <main id="offline-home-main">
    <section id="offline-home-title" class="home-screen" aria-labelledby="offline-home-heading">
      <header class="home-heading">
        <h1 id="offline-home-heading">小黑屋</h1>
        <p>从一间黑暗的屋子开始。</p>
      </header>
      <button id="offline-home-start" class="home-start" type="button">开始游戏</button>
      <p class="home-caption">文字冒险 · 纯离线</p>
    </section>
    <section id="offline-home-modes" class="home-screen" aria-labelledby="offline-mode-heading" hidden>
      <button id="offline-home-back" class="home-back" type="button">← 返回</button>
      <header class="home-heading mode-heading">
        <h2 id="offline-mode-heading" tabindex="-1">选择模式</h2>
      </header>
      <div class="home-mode-list">
        <button id="offline-mode-normal" class="home-mode" type="button">
          <span class="home-mode-name">普通模式</span>
          <span id="offline-mode-normal-description" class="home-mode-description">原版玩法，从小黑屋开始。</span>
        </button>
        <button id="offline-mode-rogue" class="home-mode" type="button">
          <span id="offline-mode-rogue-name" class="home-mode-name"></span>
          <span id="offline-mode-rogue-description" class="home-mode-description"></span>
        </button>
      </div>
    </section>
    <section id="offline-home-slots" class="home-screen" aria-labelledby="offline-slots-heading" hidden>
      <button id="offline-slots-back" class="home-back" type="button">← 返回</button>
      <header class="home-heading slots-heading">
        <h2 id="offline-slots-heading" tabindex="-1">选择存档</h2>
        <p id="offline-slots-mode"></p>
      </header>
      <div id="offline-slot-list" aria-label="存档栏位"></div>
      <p class="home-slot-note">每个模式 3 个存档，互不影响。</p>
    </section>
  </main>
  <p id="offline-home-feedback" role="status" hidden></p>
  <footer class="home-footer">
    <div class="home-footer-actions">
      <button id="offline-home-theme" type="button"></button>
      <a href="about.html?from=home">关于与许可</a>
    </div>
    <span>原作：doublespeak games</span>
  </footer>
  <div id="offline-home-dialog-layer" hidden>
    <section id="offline-home-dialog" role="dialog" aria-modal="true" aria-labelledby="offline-home-dialog-heading" aria-describedby="offline-home-dialog-description">
      <h2 id="offline-home-dialog-heading"></h2>
      <p id="offline-home-dialog-description"></p>
      <div class="home-dialog-actions">
        <button id="offline-home-dialog-close" class="home-start" type="button">返回</button>
        <button id="offline-home-dialog-confirm" class="home-start" type="button" hidden>删除</button>
      </div>
    </section>
  </div>
</body>
</html>
